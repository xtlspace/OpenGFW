name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version/tag, e.g. v1.0.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    env:
      GOOS: linux
      CGO_ENABLED: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: go mod download

      - name: Build linux binaries
        run: |
          mkdir -p build_assets
          for arch in 386 amd64 arm64; do
            echo "Building linux/$arch"
            GOARCH="$arch" go build -v \
              -trimpath \
              -ldflags "-s -w -buildid=" \
              -o "build_assets/OpenGFW-linux-$arch" \
              .
            ls -lh "build_assets/OpenGFW-linux-$arch"
            file "build_assets/OpenGFW-linux-$arch"
          done

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          files: build_assets/*
